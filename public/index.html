<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Todo App</h1>
    <form id="task-form">
      <input id="task-title" name="title" type="text" maxlength="200">
      <button type="submit">Add</button>
      <p id="form-message"></p>
    </form>
    <p id="status-message"></p>
    <ul id="task-list"></ul>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
