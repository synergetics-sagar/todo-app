<svg width="820" height="560" viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Todo app UML class diagram</title>
<desc>Class diagram showing Task data model and the frontend components (ApiClient, Renderer, TaskFormHandler, TaskItemControls, FilterController) and their relationships.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="820" height="560" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif">

  <!-- Task class (center) -->
  <g>
    <rect x="330" y="20" width="160" height="100" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <rect x="330" y="20" width="160" height="28" fill="none"/>
    <text x="410" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#085041">Task</text>
    <line x1="330" y1="48" x2="490" y2="48" stroke="#0F6E56" stroke-width="0.7"/>
    <text x="340" y="66" font-size="12" fill="#085041">+ id: number</text>
    <text x="340" y="84" font-size="12" fill="#085041">+ title: string</text>
    <text x="340" y="102" font-size="12" fill="#085041">+ completed: boolean</text>
  </g>

  <!-- ApiClient -->
  <g>
    <rect x="330" y="180" width="160" height="130" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="410" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#3C3489">ApiClient</text>
    <line x1="330" y1="208" x2="490" y2="208" stroke="#534AB7" stroke-width="0.7"/>
    <text x="340" y="226" font-size="11.5" fill="#3C3489">+ getTasks()</text>
    <text x="340" y="244" font-size="11.5" fill="#3C3489">+ addTask(title)</text>
    <text x="340" y="262" font-size="11.5" fill="#3C3489">+ toggleTask(id,</text>
    <text x="350" y="278" font-size="11.5" fill="#3C3489">completed)</text>
    <text x="340" y="296" font-size="11.5" fill="#3C3489">+ deleteTask(id)</text>
  </g>

  <!-- Renderer -->
  <g>
    <rect x="580" y="180" width="180" height="90" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
    <text x="670" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#712B13">Renderer</text>
    <line x1="580" y1="208" x2="760" y2="208" stroke="#D85A30" stroke-width="0.7"/>
    <text x="590" y="226" font-size="11.5" fill="#712B13">+ renderList(tasks)</text>
    <text x="590" y="244" font-size="11.5" fill="#712B13">+ renderEmptyState()</text>
  </g>

  <!-- TaskFormHandler -->
  <g>
    <rect x="40" y="180" width="200" height="80" rx="6" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
    <text x="140" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#72243E">TaskFormHandler</text>
    <line x1="40" y1="208" x2="240" y2="208" stroke="#993556" stroke-width="0.7"/>
    <text x="50" y="226" font-size="11.5" fill="#72243E">+ onSubmit(title)</text>
  </g>

  <!-- TaskItemControls -->
  <g>
    <rect x="40" y="380" width="200" height="100" rx="6" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
    <text x="140" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#72243E">TaskItemControls</text>
    <line x1="40" y1="408" x2="240" y2="408" stroke="#993556" stroke-width="0.7"/>
    <text x="50" y="426" font-size="11.5" fill="#72243E">+ onToggle(id)</text>
    <text x="50" y="444" font-size="11.5" fill="#72243E">+ onDelete(id)</text>
  </g>

  <!-- FilterController -->
  <g>
    <rect x="580" y="380" width="180" height="100" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="670" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#633806">FilterController</text>
    <line x1="580" y1="408" x2="760" y2="408" stroke="#854F0B" stroke-width="0.7"/>
    <text x="590" y="426" font-size="11.5" fill="#633806">+ currentFilter: string</text>
    <text x="590" y="444" font-size="11.5" fill="#633806">+ applyFilter(tasks)</text>
  </g>

  <!-- Relationships -->
  <!-- ApiClient -> Task -->
  <line x1="410" y1="180" x2="410" y2="120" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="418" y="152" font-size="11" fill="#5f5e5a">fetches / mutates</text>

  <!-- TaskFormHandler -> ApiClient -->
  <line x1="240" y1="220" x2="328" y2="230" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="248" y="245" font-size="11" fill="#5f5e5a">calls addTask</text>

  <!-- TaskItemControls -> ApiClient -->
  <path d="M180 380 C180 300, 260 260, 328 250" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="185" y="330" font-size="11" fill="#5f5e5a">calls toggleTask,</text>
  <text x="185" y="344" font-size="11" fill="#5f5e5a">deleteTask</text>

  <!-- FilterController -> Renderer -->
  <path d="M670 380 C670 340, 670 300, 670 270" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="678" y="330" font-size="11" fill="#5f5e5a">provides filtered</text>
  <text x="678" y="344" font-size="11" fill="#5f5e5a">list</text>

  <!-- Renderer -> Task -->
  <path d="M600 180 C540 130, 480 90, 490 70" fill="none" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="500" y="140" font-size="11" fill="#5f5e5a">displays</text>

</g>
</svg>
