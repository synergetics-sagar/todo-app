<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Todo app user flow</title>
<desc>Flowchart of the user journey through the todo app: load, view tasks, then branch into add, toggle, delete, or filter actions, all persisting to the backend, with success and failure paths.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="620" fill="#ffffff"/>
<g font-family="Helvetica, Arial, sans-serif">

  <!-- App loads -->
  <rect x="270" y="20" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.7"/>
  <text x="340" y="47" text-anchor="middle" font-size="14" fill="#2C2C2A">App loads</text>

  <line x1="340" y1="64" x2="340" y2="104" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Fetch tasks -->
  <rect x="240" y="104" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
  <text x="340" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Fetch tasks</text>
  <text x="340" y="144" text-anchor="middle" font-size="12" fill="#0F6E56">GET /tasks (US-2)</text>

  <line x1="340" y1="160" x2="340" y2="200" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Render list -->
  <rect x="220" y="200" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
  <text x="340" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Render list or empty state</text>
  <text x="340" y="240" text-anchor="middle" font-size="12" fill="#0F6E56">Filter: All / Active / Completed</text>

  <line x1="340" y1="256" x2="340" y2="290" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- User chooses action -->
  <rect x="60" y="290" width="560" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.7"/>
  <text x="340" y="315" text-anchor="middle" font-size="14" fill="#2C2C2A">User chooses an action</text>

  <line x1="130" y1="330" x2="130" y2="370" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="340" y1="330" x2="340" y2="370" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="550" y1="330" x2="550" y2="370" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Add task -->
  <rect x="40" y="370" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
  <text x="130" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Add task</text>
  <text x="130" y="410" text-anchor="middle" font-size="12" fill="#534AB7">POST /tasks (US-1)</text>

  <!-- Toggle status -->
  <rect x="250" y="370" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
  <text x="340" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Toggle status</text>
  <text x="340" y="410" text-anchor="middle" font-size="12" fill="#534AB7">PATCH /tasks/:id (US-3)</text>

  <!-- Delete task -->
  <rect x="460" y="370" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
  <text x="550" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Delete task</text>
  <text x="550" y="410" text-anchor="middle" font-size="12" fill="#534AB7">DELETE /tasks/:id (US-4)</text>

  <!-- Converge lines to decision box -->
  <line x1="130" y1="426" x2="130" y2="450" stroke="#5f5e5a" stroke-width="1.3"/>
  <line x1="550" y1="426" x2="550" y2="450" stroke="#5f5e5a" stroke-width="1.3"/>
  <line x1="340" y1="426" x2="340" y2="466" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M130 450 L340 450" fill="none" stroke="#5f5e5a" stroke-width="1.3"/>
  <path d="M550 450 L340 450" fill="none" stroke="#5f5e5a" stroke-width="1.3"/>

  <!-- Backend call decision -->
  <rect x="240" y="466" width="200" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.7"/>
  <text x="340" y="488" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Backend call succeeds?</text>
  <text x="340" y="506" text-anchor="middle" font-size="12" fill="#D85A30">json-server writes db.json</text>

  <line x1="240" y1="494" x2="140" y2="540" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="440" y1="494" x2="540" y2="540" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <text x="175" y="522" text-anchor="middle" font-size="12" fill="#3d3d3a">yes</text>
  <text x="510" y="522" text-anchor="middle" font-size="12" fill="#3d3d3a">no</text>

  <!-- Success -->
  <rect x="40" y="540" width="180" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
  <text x="130" y="565" text-anchor="middle" font-size="12" fill="#085041">Update UI, US-6 persisted</text>

  <!-- Failure -->
  <rect x="460" y="540" width="180" height="40" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.7"/>
  <text x="550" y="565" text-anchor="middle" font-size="12" fill="#791F1F">Roll back, show error</text>

</g>
</svg>
