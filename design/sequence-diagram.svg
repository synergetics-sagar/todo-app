<svg width="800" height="620" viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Add Task sequence diagram</title>
<desc>Sequence diagram showing User, Frontend, json-server API, and db.json interacting to add a task, including the error rollback path.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="800" height="620" fill="#ffffff"/>

<!-- Lifelines -->
<g font-family="Helvetica, Arial, sans-serif">
  <!-- Headers -->
  <rect x="40" y="20" width="140" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="110" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">User</text>

  <rect x="260" y="20" width="160" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Frontend (app.js)</text>

  <rect x="500" y="20" width="160" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="580" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">json-server API</text>

  <rect x="700" y="20" width="80" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="740" y="45" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">db.json</text>

  <!-- Lifelines -->
  <line x1="110" y1="60" x2="110" y2="600" stroke="#c8c6bd" stroke-width="1"/>
  <line x1="340" y1="60" x2="340" y2="600" stroke="#c8c6bd" stroke-width="1"/>
  <line x1="580" y1="60" x2="580" y2="600" stroke="#c8c6bd" stroke-width="1"/>
  <line x1="740" y1="60" x2="740" y2="600" stroke="#c8c6bd" stroke-width="1"/>

  <!-- 1. User -> Frontend -->
  <line x1="110" y1="90" x2="335" y2="90" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="225" y="82" text-anchor="middle" font-size="12" fill="#3d3d3a">Type task title, submit</text>

  <!-- 2. Frontend self (validate) -->
  <rect x="340" y="108" width="120" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
  <text x="400" y="126" text-anchor="middle" font-size="11.5" fill="#3C3489">Validate non-empty</text>

  <!-- 3. Frontend -> API -->
  <line x1="340" y1="160" x2="575" y2="160" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="460" y="152" text-anchor="middle" font-size="12" fill="#3d3d3a">POST /tasks {title, completed:false}</text>

  <!-- 4. API -> DB -->
  <line x1="580" y1="190" x2="735" y2="190" stroke="#3d3d3a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="660" y="182" text-anchor="middle" font-size="12" fill="#3d3d3a">Append task record</text>

  <!-- 5. DB -->> API (dashed return) -->
  <line x1="740" y1="220" x2="585" y2="220" stroke="#73726c" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>
  <text x="660" y="212" text-anchor="middle" font-size="12" fill="#73726c">Write confirmed</text>

  <!-- 6. API --> Frontend (dashed return) -->
  <line x1="580" y1="250" x2="345" y2="250" stroke="#73726c" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>
  <text x="460" y="242" text-anchor="middle" font-size="12" fill="#73726c">201 Created {id, title, completed}</text>

  <!-- 7. Frontend self (update array) -->
  <rect x="340" y="268" width="150" height="28" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
  <text x="415" y="286" text-anchor="middle" font-size="11.5" fill="#3C3489">Update local task array</text>

  <!-- 8. Frontend --> User (dashed return) -->
  <line x1="340" y1="320" x2="115" y2="320" stroke="#73726c" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>
  <text x="225" y="312" text-anchor="middle" font-size="12" fill="#73726c">Render new task in list</text>

  <!-- Note box -->
  <rect x="260" y="350" width="440" height="70" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
  <text x="480" y="375" text-anchor="middle" font-size="12" fill="#712B13">On failure (network error or 404):</text>
  <text x="480" y="393" text-anchor="middle" font-size="12" fill="#712B13">Frontend rolls back the local change</text>
  <text x="480" y="409" text-anchor="middle" font-size="12" fill="#712B13">and shows an inline error message</text>
</g>
</svg>
